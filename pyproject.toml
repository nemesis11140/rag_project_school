[project]
name = "rag-project-school"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "jieba==0.42.1",
    "numpy==1.26.4",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pandas==2.2.3",
    "pdfplumber==0.11.6",
    "pydantic==2.11.1",
    "pymilvus==2.5.10",
    "pymysql==1.1.1",
    "rank-bm25==0.2.2",
    "redis==5.2.1",
    "requests==2.32.3",
    "scikit-learn==1.6.1",
    "scipy>=1.11",
    "sentence-transformers==4.1.0",
    "torch>=2.0.0",
    "transformers==4.51.3",
    "uvicorn==0.34.2",
]

[tool.uv]
# 不要用 Anaconda 自带的解释器：它的 Python 与 torch 的 C++ DLL 不兼容，
# 会在 import torch 时报 WinError 1114。详见 README 的"环境要求"。
python-preference = "managed"
