[mysql]
host = localhost
port = 3306
user = root
# 密码从 .env / 环境变量 MYSQL_PASSWORD 读取（此处留空即可）
password =
charset = utf8mb4

[database]
db_name = rag_project_school_db
table_name = high_frequency_qa

[data]
data_dir = data

[document]
# 文本层字符数低于该值的页面才走 OCR。
# 定太高会把"文本层本来就干净但较短"的页面也送去 OCR，用 OCR 噪声替换干净文本，
# 而且 CPU 上 OCR 约 20s/页。实测：<20 只需 OCR 2 页，<50 要 OCR 12 页。
min_page_chars = 20
# 纯扫描件 PDF 每页都会低于阈值，OCR 会全量生效
ocr_fallback = true
ocr_lang = ch
ocr_dpi = 200

[model]
model_dir = model

[redis]
host = localhost
port = 6379
# 密码从 .env / 环境变量 REDIS_PASSWORD 读取（此处留空即可）
password =
db = 1
qa_original_key = qa_original_questions
qa_tokenized_key = qa_tokenized_questions
qa_index_key = qa_index

[milvus]
host = localhost
port = 19530
database_name = rag_project_school
collection_name = rag_knowledge_base

[chunking]
parent_chunk_size = 1000
parent_chunk_overlap = 0
child_chunk_size = 300
child_chunk_overlap = 50
min_child_chunk_size = 20

[embedding]
model_name = BAAI/bge-m3
model_path = bge-m3
device = cpu

[intent_model]
model_path = bert_intent
base_model_path = bert-base-chinese
# auto = 优先 BERT，没有分类头则用 sklearn，再降级到关键词规则
# 可选: bert | sklearn | rules
backend = auto
device = cpu
# 置信度低于该值时降级到关键词规则
confidence_threshold = 0.6

[reranker]
# base 版 hidden_size 768，不到 large 版（1024）的一半大小，CPU 上快得多。
# 想换回精度更高的 large 版（需先自行下载到 model/bge-reranker-large）：
#   bge-reranker-large
model_path = bge-reranker-base
# 有 GPU 时改成 cuda 可以把精排从秒级降到几百毫秒
device = cpu
batch_size = 16
max_length = 512
# 送入精排的候选数上限
max_docs = 8

[llm]
# 必须是完整的 chat/completions 路径。
# 只写 https://api.deepseek.com 会 404，不加 /v1 也可以：
# https://api.deepseek.com/chat/completions
api_url = https://api.deepseek.com/v1/chat/completions
# API Key 从 .env / 环境变量 LLM_API_KEY 读取（此处留空即可）
api_key =
# deepseek-flash / deepseek-v4-pro 都是推理模型：思考过程计入 max_tokens，
# 实测同一个 RAG 问题思考能吃掉全部 2000 tokens，导致 content 为空、耗时 10s。
# 这个场景是"基于给定文档抽取答案"，不需要长推理链，关掉思考更快更稳。
# 已实测可用的值：
#   {"thinking": {"type": "disabled"}}      或   {"reasoning_effort": "none"}
# 非推理模型留空即可：  extra_body =
model_name = deepseek-flash
temperature = 0.7
max_tokens = 2000
extra_body = {"thinking": {"type": "disabled"}}

[qa_generation]
num_pairs = 200
min_line_length = 15
max_question_length = 500
max_answer_length = 2000

[system]
# 标定依据：scripts/calibrate_qa_thresholds.py
# 自匹配（CSV 原问题查自己）覆盖率全部为 1.00，所以阈值不影响自匹配；
# 0.7 是在"能召回同义改写"和"不把『宿舍几点熄灯』错配到『宿舍什么时候开门』"
# 之间取到的平衡点。
bm25_threshold = 3.0
keyword_overlap_threshold = 0.7
# BM25/覆盖率仅筛选候选；非原文精确匹配还必须通过问题语义等价校验。
faq_candidate_count = 5
faq_semantic_min_confidence = 0.9
faq_semantic_timeout = 15
default_top_k = 5
recall_multiplier = 3
# 改写后最多用几条 query 去召回（原问题一定保留）
rewrite_max_queries = 2
# 送入 LLM 的父块上下文总长度上限
context_max_chars = 4000
