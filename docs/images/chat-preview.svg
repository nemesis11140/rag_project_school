  <rect x="1086" y="611" width="40" height="35" rx="8" fill="#4079ee"/>
  <text x="1106" y="635" text-anchor="middle" font-size="20" fill="#ffffff">➤</text>
  <text x="734" y="679" text-anchor="middle" font-size="13" fill="#64748b">按 Enter 发送消息 | 基于《2025学生手册》《2025教职工手册》</text>
</svg>
